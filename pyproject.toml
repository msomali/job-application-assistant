[project]
name = "job-application-assistant"
version = "0.1.0"
description = "Automated job application pipeline — monorepo workspace"
requires-python = ">=3.11"
dependencies = [
    "job-core @ file:///./core",
]

[project.scripts]
job = "cli.main:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
