[project]
name = "job-core"
version = "0.1.0"
description = "Core library for Job Application Assistant"
requires-python = ">=3.11"
dependencies = [
    "firecrawl-py==4.19.0",
    "anthropic==0.86.0",
    "pydantic==2.12.5",
    "sqlite-utils==3.39",
    "click==8.3.1",
    "claude-agent-sdk==0.1.50",
    "python-telegram-bot==22.7",
    "playwright==1.58.0",
    "python-dotenv==1.2.2",
    "pyyaml>=6.0",
    "Pillow>=10.0",
    "google-genai>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=4.0",
]

[project.scripts]
job = "cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "cli*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["integration: requires running PostgreSQL"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "S", "B", "UP"]
ignore = ["S608", "S603", "S110", "S112", "E501", "E402"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
