name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: "sk-test-fake-key"
      FIRECRAWL_API_KEY: "fc-test-fake-key"
      TELEGRAM_BOT_TOKEN: "fake-token"
      TELEGRAM_USER_ID: "12345"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: make ci

      - name: Lint
        run: make lint

      - name: Type check
        run: make typecheck

      - name: Test
        run: make test
